name: Architecture workspace check
on:
  push:
    branches: ['work/architecture-implementation-20260905']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 --version
          test -f 01_source/manifest.csv
          test -f .agents/skills/career-planning/SKILL.md
          echo 'Repository workspace is available; no content modified.'
