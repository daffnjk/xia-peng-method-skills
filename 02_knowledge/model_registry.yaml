  name: 职场能力同心圆
  source_definition: 内圈为自我管理，中圈为人际与思维，外圈为领导团队；课程用 1—5、5—10、10—15 年作经验性阶段。
  status: source_defined_heuristic
  source_refs:
  - XP-T-004#P125-P143
- model_id: XP-M-020
  name: 职业连续性跳槽阶梯
  source_definition: 从现岗找长板、同公司转岗、同岗同行业，到同岗异行业、同行业异岗，再到异岗异行业异地，同时变化的变量越多越难。
  status: source_defined
  source_refs:
  - XP-T-004#P172-P216
