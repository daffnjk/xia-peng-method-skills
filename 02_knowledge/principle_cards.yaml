- {"id":"XP-P-072","title":"刘澜｜从笔记到生活：成人、求美与烹调","evidence_type":"summarized","confidence":"high","statement":"本书把学习指向实际工作、人际关系和个人成长，也讨论成人与求美；把书当作烹调书，重在能够运用模式而非只收集成品。","when_to_use":["界定读书完成标准","防止知识整理替代行动","避免把实用窄化成收入"],"procedure":["明确知识要改善哪类真实活动。","保留一个应用实例及反馈，必要时修改方法。","将自己的应用体验与作者原意分开保存。"],"guardrails":["阅读、填写笔记或教导别人本身不证明完成用。","简洁、丰富、惊讶是书中转述的审美标准，不是本项目证明的通用评价定律。","不把所有学习价值缩为赚钱或可量化产出。"],"source_refs":["XP-T-005#P024"],"author":"刘澜","source_kind":"external_book","procedure_evidence":"材料归纳与工程化应用；操作模板、验收和风险护栏不冒充作者逐字指令。","source_pages":{"printed":"351、356、366—369","pdf_spreads":[182,185,190,191]},"model_definition":{"实际应用领域":["工作","人际关系","个人成长"],"书中转述的理论美标准":["简洁","丰富","惊讶"]}}
- id: XP-P-073
  title: 职场沟通的本质是工作结果的达成
  evidence_type: explicit
  confidence: high
  statement: 职场沟通以"职场"为边界：一切沟通的目的是工作结果的达成，并不断提高到高效达成；与工作结果不相关的聊天、八卦、吃饭不属于职场沟通范畴。沟通不限于口头，邮件、形成SOP都可以是沟通。若无论怎么沟通对方都无法达成结果，换人也是合理选项，因为沟通只是结果达成的一个要素。
  when_to_use:
  - 判断某个关系或对话是否值得投入沟通成本
  - 简化职场人际问题，避免把工作复杂化
  procedure:
  - 先判断该沟通与工作结果是否相关
  - 相关则处理，不相关则不纳入职场沟通范畴
  - 检查现有沟通方式是否还能提高结果达成的效率
  guardrails:
  - 该定义将部分人际议题排除在"职场沟通"外，是来源的方法论边界，不是否定其人际价值
  - 极端场景"直接换人"指沟通要素失效时的取舍，不是默认手段
  source_refs:
  - XP-T-006#P002-P004
- id: XP-P-074
  title: 沟通三目的：减少误解、构建信任、产生结果
  evidence_type: explicit
  confidence: high
  statement: 需要沟通的三个目的：一是减少误解（君子论迹不论心，用简洁直接的沟通让说的、听到的、做的一致）；二是构建信任（信任建立后沟通成本大幅下降）；三是产生结果（任何沟通不产生结果等于没有沟通）。反信号是误解增加、信任瓦解、无结果。
  when_to_use:
  - 评估一次沟通是否有效
  - 检查团队会议长期议而不决的根因
  procedure:
  - 沟通后自查三目的：误解是否减少、信任是否增强、结果是否产生
  - 出现反信号即回到沟通原则自查
  guardrails:
  - 三目的服务于工作结果，不适用于以情感联结为主要目的的私人沟通
  source_refs:
  - XP-T-006#P006-P009
- id: XP-P-075
  title: 有效沟通三原则：坦诚、利他、清晰
  evidence_type: explicit
  confidence: high
  statement: 有效沟通的三个原则：坦诚（怎么想就怎么说，尤其对自己坦诚，减少误解）、利他（满足别人的需求，别人满足你的需求，构建信任）、清晰（具体、可测量、有资源配比和时间表，产生结果）。回答任何"怎么办"之前先问是什么、为什么和原则（WWP思考）。
  when_to_use:
  - 任何职场沟通的准备与自查
  - 面对拒绝或沟通失效时的复盘框架
  procedure:
  - 用坦诚核对：我的需求想清楚了吗
  - 用利他核对：对方的需求抓到了吗
  - 用清晰核对：目标、数字、时间表说清楚了吗
  guardrails:
  - 三原则是自查顺序，不是说服他人的话术
  - 「情商高不等于说漂亮话」，不得用三原则包装操纵式沟通
  principle_refs:
  - XP-P-074
  source_refs:
  - XP-T-006#P010-P013
- id: XP-P-076
  title: 沟通前准备三问
  evidence_type: explicit
  confidence: high
  statement: 坦诚即沟通前的准备，依次回答三问：一、我需要什么？用SMART把需求标定到具体、可测量、可达到、有相关性、有时间表；二、我最需要什么？用二八原则排序，在底线与让步之间做取舍，拒绝既要又要还要；三、我真的需要吗？用奥卡姆剃刀（如无必要勿增实体）去掉非真实需求并拿掉情绪。
  when_to_use:
  - 重要沟通、谈判、绩效面谈前的准备
  - 情绪焦虑或选择困难时的自我梳理
  procedure:
  - 用SMART逐项追问自己的需求，禁用抽象名词和形容词
  - 多个目标时做价值排序，锁定底线，其余列为可让步项
  - 用奥卡姆剃刀复核：这是我要的，还是别人告诉我该要的
  guardrails:
  - 排序结论因人而异，不替用户预设"钱最重要"之类的价值排序
  - 未经用户确认不得把推定需求写成事实
  model_refs:
  - XP-M-003
  source_refs:
  - XP-T-006#P015-P024
- id: XP-P-077
  title: 沟通即交易：利己是目的，利他是手段
  evidence_type: explicit
  confidence: high
  statement: 沟通的本质一是澄清需求，二是形成交易：你的需求和对方的需求换一换。利己是目的、利他是手段，不能把利己既当目的又当手段；只有利他才能产生合作，合作最终产生利己的结果。只知道讲自己的需求而不知道对方需求，沟通与对方无关。
  when_to_use:
  - 争取资源、加人、涨薪、跨部门求助等交换型沟通
  - 检查"为什么对方不听我的"
  procedure:
  - 先抓对方需求，再摆自己的需求
  - 确认自己的需求中有哪些可作为交换筹码
  guardrails:
  - 利他是手段不等于道德绑架或无条件付出
  - 对方无可交换需求且无合作意愿时，接受沟通不成立
  source_refs:
  - XP-T-006#P027-P028
- id: XP-P-078
  title: 信息即需求与提问方法
  evidence_type: explicit
  confidence: high
  statement: 对方传递的任何信息都应解码为需求：领导的话不是指令而是需求。抓需求的提问方法：直接法（直接问目标、指标、困难、能一起做什么）、询问建议法（抛出想法请对方评价，把评价翻译成需求）、宏观法（请对方对趋势做判断，打开话匣子后解码）、借外力（从第三方信息推断需求）；破冰可用正向（展望、好消息、怎么参与）与负向（困难、怎么帮助）开场。
  when_to_use:
  - 与领导、客户、合作伙伴的首次沟通
  - 会议、绩效面谈、闲谈等一切信息输入场景
  procedure:
  - 对方每输出一段信息，自问"他的需求是什么"
  - 用SMART式追问把对方需求标定到具体、数字、时间
  - 无法直接接触时从第三方信息推断并验证
  guardrails:
  - 「从来没有闲谈」指信息利用意识，不等于把私人关系全部工具化
  - 推断出的需求需验证，不得直接写成对方立场
  model_refs:
  - XP-M-003
  source_refs:
  - XP-T-006#P029-P034
- id: XP-P-079
  title: 策划：冲突判定、汇率与底线让步
  evidence_type: explicit
  confidence: high
  statement: 第二轮沟通前先策划：判断双方需求是否有冲突。无冲突则进入交换，谈"汇率"（需求以什么比例交换），谈汇率代表交换前提已存在，不应转身就走；让步围绕底线展开——底线来自"我需要什么、我最需要什么、我真的需要吗"，底线守住、其余皆可让。有分歧先回归共识、可暂停但不要谈崩；有冲突则让步加深挖需求寻找新交换点，仍无解则搁置。
  when_to_use:
  - 谈判、涨薪、资源争取等交换型沟通的准备
  - 沟通陷入分歧或僵局时
  procedure:
  - 列出双方需求，判断冲突与否
  - 无冲突：定汇率、明底线、做让步
  - 有分歧：回归共识、暂停、带回方案再谈
  - 有冲突：让步加深挖替代需求寻找新交换点
  guardrails:
  - 底线是用户自己确认的，不得由助手代设
  - 搁置是策略不是逃避，需带回来再谈
  case_refs:
  - XP-C-020
  source_refs:
  - XP-T-006#P036-P040
- id: XP-P-080
  title: 迫切程度与"先让对方赢我不输"
  evidence_type: explicit
  confidence: high
  statement: 搁置时分析双方需求的迫切程度：谁急谁让步，可把时间维度加入交换（短期让步换长期利益），尽量以不急的状态进入沟通。最优策略是双赢，次优策略是"先让对方赢而我不输"，依靠多轮次博弈（释放善意、模仿对方上一轮策略）在后续轮次赢回；对方持续要求我输，则停止与其沟通。
  when_to_use:
  - 交换条件谈判中的节奏设计
  - 长期合作关系中的让步决策
  procedure:
  - 评估我与对方谁更迫切，设计短期或长期让步结构
  - 可接受"对方赢我不输"以推进关系与行动
  - 用时间协同、第三方参与、利益点转移创造双赢可能
  guardrails:
  - 「我不输」以底线可守住为前提，不是无条件退让
  - 多轮次博弈的前提是对方会回报善意；持续不回报即止损
  source_refs:
  - XP-T-006#P041-P043
- id: XP-P-081
  title: 清晰表达与共识、会后文字确认
  evidence_type: explicit
  confidence: high
  statement: 清晰表达的方法：反复用SMART理双方需求，练习一句话说清"我怎么帮他、他怎么帮我"；重要沟通"写下来、发过去、约时间、充分谈"，用它反向检验坦诚与利他；谈时围绕找共识、稳共识、回归共识、深挖共识（他的需求我懂、我的需求他懂）；避免术语缩写，多用数字、时间、日期、动词；多提问少论证，用"认同+小问题"让对方持续输出；关键共识与行动计划形成后必须会后文字确认（纪要或消息），谈完不立字据等于白谈。
  when_to_use:
  - 汇报、绩效面谈、客户沟通等重要正式沟通
  - 说话易绕、怕现场发挥失常的场景
  procedure:
  - 会前：一句话需求加书面材料发出并约时间
  - 会中：以共识为中心，多提问少论证，用数字日期动词
  - 会后：立即文字确认关键共识与下一步计划
  guardrails:
  - 「写下来发过去」不等于交出底牌，底线不写入材料
  - 文字确认记录共识与行动，不替对方代签承诺
  case_refs:
  - XP-C-021
