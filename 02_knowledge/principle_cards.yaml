  - XP-T-006#P045-P052
- id: XP-P-082
  title: 面对拒绝：分类与改变主观看法
  evidence_type: explicit
  confidence: high
  statement: 被拒绝先在自己身上找问题（坦诚、利他、清晰是否达标），再把拒绝分类：情绪需求未满足（有情绪的拒绝，按情绪方法处理）与价值需求未满足（没情绪的拒绝）。对价值型拒绝：不改变客观因素，改变对方的主观解读；果不可改、因可改，把讨论从结果拉回原因与未来；用价值需求层次模型做逐级高位引领，认同其观点、提升问题而非给答案，最终推进到"我们能不能试一试"。
  when_to_use:
  - 提涨薪、要资源、推方案被拒
  - 对方诚恳地以客观困难为由拒绝时
  procedure:
  - 先按三原则自查自己的沟通质量
  - 判断拒绝类型：情绪型还是价值型
  - 价值型：认同客观环境，不否定对方
  - 逐级上拉：结果到行为到能力到价值观到身份，做高位引领
  - 收口于小行动："那我们一起试一试"
  guardrails:
  - 高位引领不是讽刺性戴高帽，前提是真诚认同对方的处境
  - 禁止向下历史归因（贴身份标签、翻旧账），必谈崩
  - 多轮仍无行动意愿时接受搁置或止损
  model_refs:
  - XP-M-031
  source_refs:
  - XP-T-006#P053-P061
- id: XP-P-083
  title: 沟通中的情绪管理
  evidence_type: explicit
  confidence: high
  statement: 情绪对结果无帮助时撇到一边。自己有情绪：体察到即暂停沟通（"抱歉，我可能没有说清楚，让你误解了"），情绪的锚点是某种需求未被满足，回坦诚三问重新整理需求，用ABC模型阻断信念（B）产生的后果。对方有情绪：不被带节奏，用镜子法重复对方话语让其降温释放，识别情绪背后的需求并满足（愤怒缺尊重、焦虑缺安全感、抑郁是后悔、冷漠是失望）；多次无效则暂停沟通，但用积极话语收尾画句号。
  when_to_use:
  - 沟通上头、冲突升级现场
  - 面对愤怒、焦虑、冷漠的沟通对象
  procedure:
  - 自察上头：立即主动暂停，用黄金句收住
  - 复盘情绪扳机：用ABC拆行为、信念、结果
  - 对方有情绪：镜子法重复，补上情绪背后的需求
  - 全部无效：暂停，用积极方式结束，择期再谈
  guardrails:
  - 重复对方话术的镜子法是降温手段，不是讽刺模仿
  - 「情绪即需求」推定需结合语境验证，不代替专业心理支持
  model_refs:
  - XP-M-032
  source_refs:
  - XP-T-006#P062-P068
- id: XP-P-084
  title: 与领导沟通
  evidence_type: explicit
  confidence: high
  statement: 与领导沟通要点：以各种方式了解领导的需求（会议讲话、绩效面谈、任何工作沟通都是信息即需求）；高效汇报先出结果（大目标拆成已达成的小结果），没结果先尽力，竭尽全力后开SMART求助清单；不断用SMART对齐目标（向上管理的具体化）；不问方法除非领导给方法，给方法后迅速执行拿结果；主动提需求必须带数据且与领导需求不矛盾；用ART（目标、资源、时间表）留档，时间表是最应守住的底线；当众表扬时替领导做案例教学发言，当众批评时控制情绪给足尊重，私下批评后用ART回到具体工作；多次无效沟通经三原则自查和利他分析后仍无回报，可提出离职。
  when_to_use:
  - 向上汇报、争取资源、应对表扬批评
  - 判断与领导的沟通是否还值得继续
  procedure:
  - 会前：结果、努力、SMART求助单三备
  - 会中：对齐目标，讨论what、why和原则而非具体how
  - 领导给方法：确认后迅速执行出结果
  - 落档：ART文档，守住时间表底线
  guardrails:
  - 满足领导需求是职责的一部分，不是当马屁精，也不为坏人洗白
  - 「唯快不破」以商量定案为前提
  - 离职建议只在用户主动求评估时讨论，不主动怂恿
  model_refs:
  - XP-M-003
  - XP-M-008
  source_refs:
  - XP-T-006#P069-P077
- id: XP-P-085
  title: 与下属沟通
  evidence_type: explicit
  confidence: high
  statement: 与下属沟通：同样了解下属需求，上下同欲则无需教方法；ART与时间表同样适用，领导者拿捏时间表就是公司的时钟；用GROW模型做教练（目标到现状到选项到行动，时序不可跳），先目标后问题防止变成吐槽大会；选项阶段穷举不否定，行动阶段压时间表；不给下属直接方法以免越俎代庖，让一线拿方案；内圈问题（专注、热情、信念）是招聘问题，非短期可修正；黄金问题"如果这个事不会失败，你要不要做"检测意义驱动；GROW多次无效仍不改进，以"不匹配"而非"不胜任"谈离职。
  when_to_use:
  - 绩效辅导、一对一、布置任务、团队复盘
  - 判断下属问题属于意愿、能力还是招聘错配
  procedure:
  - 按GROW顺序提问，不直接给答案
  - 现状阶段区分意愿问题与能力问题
  - 选项阶段禁止谈阻碍，穷举后再收敛
  - 行动阶段当场压出前两三步时间表
  guardrails:
  - 意义驱动检测不等于允许不合规目标（来源以割韭菜话术为反例）
  - 「不匹配不是不胜任」是对离职沟通的措辞要求，不掩盖真实绩效事实
  - GROW不是绩效惩罚工具，多次无效先查内圈与自身领导方式
  model_refs:
  - XP-M-030
  - XP-M-008
  source_refs:
  - XP-T-006#P078-P088
- id: XP-P-086
  title: 平级沟通与权责利三位一体
  evidence_type: explicit
  confidence: high
  statement: 平级沟通复用SMART、ART、GROW；核心认知是平级之间也存在领导力关系——事决定岗位、谁负责谁主导，GROW可把"你"换"我"自查或换"我们"协同。理顺平级关系的本质是把权责利理清楚：责是第一位（谁为结果负责），据责配权（说了算、仲裁、推动）与利（做成得利、做败担损），三者必须等量匹配。失衡诊断：责任独大到消极怠工；权力独大到人人巴结；利益独大到争夺肥缺。平级内耗减少之道是把问题归于权责利而非人际，谁推动工作谁就是未来的上级。
  when_to_use:
  - 跨部门协作、项目分工、平级指挥不动
  - 诊断组织消极怠工、争宠、抢肥缺
  procedure:
  - 先定责任人：谁为此事负责、负责比例与最终责任人
  - 按责任等量配权与利，形成三位一体
  - 发现失衡先开会重分权责利，再谈人际
  guardrails:
  - 权责利重分需要对应层级授权，助手只能提方案不能替组织决定
  - 「谁推动谁上级」指影响力而非抢夺汇报线
  model_refs:
  - XP-M-034
  - XP-M-030
  source_refs:
  - XP-T-006#P089-P096
- id: XP-P-087
  title: 与客户沟通
  evidence_type: explicit
  confidence: high
  statement: 客户沟通复用SMART（信息即需求）与ART（目标、资源、时间表），ToB客户靠养，时间表抓在自己手里；核心是带着任务高频拜访，用STN模式：问满意度收建议（建议及需求）、上新品试用扩品类、老客户推荐新客户获客；高频拜访发现新需求驱动产品迭代，提高客户转移成本从而提高付费意愿；组织层面"员工客户化、客户员工化"；最终指标是满意度与忠诚度，推荐指标用NPS净推荐值。
  when_to_use:
  - 销售或客户成功的高频拜访设计
  - 把投诉、建议转成产品需求
  procedure:
  - 每次拜访带STN任务之一：收建议、推试用、促推荐
  - 将建议投诉解码为需求，回流产品迭代
  - 用NPS跟踪推荐意愿
  guardrails:
  - 提高转移成本不等于制造锁定伤害用户利益
  - NPS等数字为来源主张的指标口径，具体项目需另行核验
  - 择业启发（选产品好且销售有话语权的公司）是来源观点，不构成对具体公司的评价
  model_refs:
  - XP-M-033
  source_refs:
  - XP-T-006#P097-P103
- id: XP-P-088
  title: 管理的本质是目标管理：让下属明白什么是最重要的
  evidence_type: explicit
  confidence: high
  statement: 管理就是让下属明白什么是最重要的；管理本质上是目标管理，约占管理工作量的80%，授权约占20%，激励约10%（加分项）。过程管理（早请示晚汇报、逐环节审批）会导致三种失败：优秀员工觉得管得过细而流失、一般员工做不好结果由领导担责、员工不被推动就不动。目标定清楚后，怎么做由团队自己讨论分析，领导负责协调资源、带复盘、到截止日期收货并用绩效区分发展与优化。
  when_to_use:
  - 判断自己是否在做管理者该做的事，还是在替下属干活
  - 团队出现"牛人不服管、出事就甩锅、不推不动"时反思管理方式
  - 向下级管理者传递管理口径时校准基本功
  procedure:
  - 先与团队对齐"什么是最重要的"并形成无歧义表述
  - 中段不做过程干预，只协调资源与保持软性沟通
  - 在时间节点复盘收货，用绩效结果做激励或优化
  guardrails:
  - 80/20/10 为讲师经验性权重【材料明确表达】，非实证比例
  - 目标管理不等于完全不管过程：安全、合规等信任边界仍需护栏
  source_refs:
  - XP-T-007#P002-P003
  - XP-T-007#P042
  model_refs: []

- id: XP-P-089
  title: KPI 与 OKR 的选择依据：按业务与劳动性质匹配，可混用
  evidence_type: explicit
  confidence: high
  statement: KPI 是自上而下的目标分解，适用于熟悉业务、体力劳动、重复性、标准化流程、稳定环境与成本领先战略；OKR（组织给方向、个人做目标响应、自下而上聚合）适用于探索业务、知识劳动、创造性工作、非标准化的小闭环、变动环境与差异化战略。同一团队可混用：探索的用 OKR，执行的用 KPI；同一人也可一半执行型 KPI、一半创造型 OKR。OKR 因蕴含主动性原则，对员工培养优于 KPI；落地抓手是给方向后多问员工"你们想怎么做"。
  when_to_use:
  - 为团队或岗位选择考核工具时
  - 公司战略（差异化或成本领先）与考核方式不一致时诊断错配
  - 推 OKR 遇阻时判断是否业务性质本不适合
  procedure:
  - 依次判断：业务熟悉或探索、体力或知识劳动、环境稳定或变动、流程标准化或小闭环
  - 按判断结果匹配 KPI 或 OKR，允许人与事层面混用
  - 用 OKR 时只定方向，让成员自行书写目标响应
  guardrails:
  - 不得宣称某工具"包打天下"；工具选择失败常源于业务性质错配
  - OKR 的方向仍需与组织目标挂钩，不是员工完全自定
  source_refs:
  - XP-T-007#P004-P009
  model_refs:
  - XP-M-004
  - XP-M-005

- id: XP-P-090
  title: SMART 之具体与可测：写下来、无歧义、测完必有后续
  evidence_type: explicit
  confidence: high
  statement: 目标必须具体、可测、可描述、无歧义、可传递，且要白纸黑字写下来才能用于考核；抽象口号是"正确而无用的废话"。可测要回答四问：怎么测（数据源与口径）、谁来测、测的频率、测完干什么——测完必须连接激励、复盘、培训或优化，否则没人把数据当回事。数据（如"收入同比提升30%"）天然无歧义，逐级传递不衰减。
  when_to_use:
  - 目标沟通与下达时检查口径
  - 考核数据不被团队重视时回查"测完干什么"是否缺失
  procedure:
  - 通过层层追问把抽象目标逼到具体可测
  - 与团队约定数据源、测量人、频率与后续动作并写下来
  guardrails:
  - 具体的小目标是非终极状态，须与相关性（大目标）挂钩
  - 纸面化是为了可考核与可传递，不是形式主义
  source_refs:
  - XP-T-007#P011-P014
  model_refs:
  - XP-M-003

- id: XP-P-091
  title: SMART 之可达成与时间表：对标定目标，节奏换授权
  evidence_type: explicit
  confidence: high
  statement: 可达成靠外部合理与内部合理匹配：对标竞品数据（可假扮顾客、面试竞对员工、行业交流获取）与自身历史数据定"跳一跳够得着"的目标，并匹配内部资源投入；目标过高会放弃、过低无成长。相关性要求"大拆小、小聚大"双向运算，战术间要有串联。时间表给节奏：两个节点之间领导不参与过程管理，按人成熟度控制碰面频率（新手一天一次、好手一周两次、顶尖一月一次），到点复盘收货。
  when_to_use:
  - 定目标出现讨价还价或拍脑袋时
  - 想从过程管理切换到节点管理时
  procedure:
  - 收集对手数据、历史数据与资源约束后设定目标区间
  - 制定时间表并在节点间授权，过程问题留给员工
  guardrails:
  - 对标手段（假扮顾客、套取竞对员工信息）须符合法律与商业伦理后再用
  - 员工态度问题（不盯就不干）不适用拉长碰面间隔，应走绩效优化
  source_refs:
  - XP-T-007#P015-P020
  model_refs:
  - XP-M-003

- id: XP-P-092
  title: 一致性原则：单一目标、北极星指标与下探一级检验
  evidence_type: explicit
  confidence: high
  statement: 个人同期目标最好单一，两个冲突目标会让团队无所适从；团队要在特定阶段围绕一个北极星指标"打穿一点形成局面"，指标越多越难一致。检验方法是"下探一级问目标"：问下级的下级其工作目标是什么，上下级口径一致说明北极星成立，不一致则回查 SMART 与目标取舍。目标不一致的团队会扯皮、和稀泥、演变为拉帮结派。
  when_to_use:
  - 团队内耗大、互相扯皮时诊断目标一致性
  - 多团队协作场景设定阶段唯一重点
  procedure:
  - 阶段内为每人设单一或非冲突目标组合
  - 用下探一级问目标做一致性抽查
  guardrails:
  - 北极星指标可随阶段切换，但固定阶段内不宜频繁更换
  - 一致性针对目标口径，不要求思维方式或表达统一
  source_refs:
  - XP-T-007#P022-P026
  model_refs: []

- id: XP-P-093
  title: 阶段性与调动性：一个目标服务一个阶段；组织目标是个人目标的放大器
  evidence_type: explicit
  confidence: high
  statement: 目标都有阶段性：明确阶段与时长，建立复盘时间表，到期切换下一阶段，支持部门（财务、人力）也要具备这种灵活性。调动性上，组织目标不是另一种目标，而是个人目标的加总与放大器；领导的目标同样是个人目标——服务、管理、帮助每一个团队成员实现目标（含招人、留人、协调资源），不得以"组织目标"自居，也不得把个人升职加薪凌驾于组织目标之上。
  when_to_use:
  - 支持部门流程僵化、与业务阶段冲突时
  - 领导以组织化身自居、小我凌驾团队时校准
  procedure:
  - 为每个目标标注所属阶段与切换条件
  - 检查成员个人目标是否与组织目标同口径且 SMART
  guardrails:
  - 阶段性不是不坚持原则，而是明确该阶段关注什么
  - 「领导没有组织目标」是讲师的表述框架，不否定领导对组织结果负责
  source_refs:
  - XP-T-007#P027-P031
  model_refs: []

- id: XP-P-094
  title: 目标制定流程：会前摸情况、会上摆事实、会后各自书写，下属说领导改
  evidence_type: explicit
  confidence: high
  statement: 会前准备：以使命愿景价值观（5-10年大目标）对齐相关性，定性战略是差异化还是成本领先，收集对手与用户等外向性数据，不做讨价还价式定目标。会上：呈现外部现状，用 SWOT 让团队（不是领导）列优势劣势，列出问题与挑战，领导靠提问让大家说，不现场形成共识。会后一天内各自书写目标与时间表，领导汇总后分层：S 级给方法要资源用 OKR；A 级半主动谈心激活；B 级直接 KPI 拆任务；D 级不写或乱写，绩效定清、白纸黑字、进入优化。口诀：下属说（不是你说）、领导改（不当场改）、大家认、照着来、开始试。
  when_to_use:
  - 月度/季度经营目标会或新团队首次定目标
  - 目标制定流于领导拍板、员工执行时重构流程
  procedure:
  - 会前完成战略定性与外部数据摸排
  - 会议只做现状呈现与问题收集，散会后要求书面目标
  - 按书写质量分层并用不同工具跟进
  guardrails:
  - D 级员工的优化须按绩效记录与法定流程，不是当场羞辱
  - SWOT 由团队共创，领导垄断判断会退回个人决策
  source_refs:
  - XP-T-007#P033-P042
  model_refs: []

- id: XP-P-095
  title: 六顶帽子：同一时段同色思维，开高效目标会与复盘会
  evidence_type: explicit
  confidence: high
  statement: 六种思维模式对应六色帽子：白=事实数据、绿=创造想象、黄=价值肯定、黑=逻辑批判（非情感批判）、红=情绪直觉、蓝=流程控制与结论（宜由领导戴）。规则：同一时间段全员戴同一顶帽子以统一思维模式；顺序不必然（讲师顺手序为红→白→绿→黑→黄→蓝），但每色至少用一次、时间分布均衡（黑色忌过多）；戴帽摘帽要有仪式感；同步思维模式但必须表达不同角度（反对"我也觉得"）；强者安排后发言；平时练习识别他人当前帽子并用同色回应。
  when_to_use:
  - 目标制定会、复盘会、问题讨论会低效或演变为争吵时
  - 一言堂或会后小会多发时重构议事规则
  procedure:
  - 设计议程并掐时间，逐色推进
  - 每色阶段指定擅长者压轴发言，蓝帽领导做结论
  guardrails:
  - 六顶帽子是外部思维工具（德波诺）在课程中的转述，非夏鹏原创
  - 工具不替代决策权：蓝帽结论仍走目标与授权边界
  source_refs:
  - XP-T-007#P044-P053
  model_refs:
  - XP-M-035

- id: XP-P-096
  title: 只问事实与问题：不问原因、不争对错、不归责
  evidence_type: explicit
  confidence: high
  statement: 管理者只需不断问团队两个问题：事实是什么、问题是什么。对主观感受先认同再追问客观（员工说累，认同辛苦，然后问数据与用户反馈）。不要问"原因是什么"——一问原因就会滑向保姆型领导（累死或牛人流失）；不争对错——争对错养出巨婴团队且权责不清；不归责——"问题在这儿谁来解决"而非"谁的错"，解决问题的人是功臣。管理是实践，验证不在逻辑而在成果，唯一权威性是成就。
  when_to_use:
  - 复盘会、日会、汇报场景聚焦讨论
  - 自己忍不住想追问原因或批评态度时
  procedure:
  - 用白帽问题收集事实与数据
  - 确认问题清单后交给员工解决，领导只在节点收货
  guardrails:
  - 不问原因指管理归因方式，不是禁止事故调查等合规必需的根因分析
  - 「开人」"通报"等讲师表述须经绩效与法律流程，不得情绪化执行
  source_refs:
  - XP-T-007#P055-P060
  model_refs: []

- id: XP-P-097
  title: 麦肯锡七步：定义问题后拆要素（不是原因），小规模验证再放大
  evidence_type: explicit
  confidence: high
  statement: 七步为：定义问题（用"不解决会怎样/解决会怎样"判断，问题要"疼了"再解）→分解要素（如收入=用户数×单笔，是客观拆解不是找原因；原因带主观情绪易甩锅）→排优先级→分析计划与时间表并落责权利（专家掌权）→小规模取证验证（MVP）→形成结论（照样回到 SMART 定下一步目标）→大规模行动；验证不成立则拉回第一步。全程无主观情绪、无归责。
  when_to_use:
  - 收入/增长类问题需要结构化拆解时
  - 问题讨论反复空转、无法收敛为行动时
  procedure:
  - 先验证问题紧迫性，再按乘法/加法关系拆要素
  - 每步落责权利与时间表，用小规模测试代替全队扑上
  guardrails:
  - 要素与原因在解决瞬间可能重合，但讨论语言必须保持要素化
  - 该流程是课程对麦肯锡方法的转述，非麦肯锡官方完整版本
  source_refs:
  - XP-T-007#P061-P065
  model_refs:
  - XP-M-037

- id: XP-P-098
  title: 通过事管人、通过人做事：尊重与激励代替管人
  evidence_type: explicit
  confidence: high
  statement: 管理的对象永远是事，对人的动词是激励。前提是尊重：承认个人需求与私利，把私利翻译成与组织挂钩的工作目标；用汉龙剃刀先假设所有人善意（博弈式回应，确认真恶再处理）；相信人自驱、能学习、能担责。操作上刚柔并济：软性沟通、刚性绩效——说软话办硬事；做事过程中认苦劳（认同情绪不一定认同做法），节点只认功劳。用意愿×能力两维度区分员工：双高授权，意愿高能力弱给机会试，双低说明不合适。
  when_to_use:
  - 团队氛围对抗、员工躺平或动辄劳动仲裁威胁时
  - 领导在"管人"与"带人"之间摇摆时校准心法
  procedure:
  - 沟通时先认同情绪，节点时按绩效刚性兑现
  - 按意愿×能力组合决定授权、试错或调整
  guardrails:
  - 尊重与激励不取代绩效淘汰；淘汰走价值观与能力不匹配的正式路径
  - 「996是福报」类表述在课程中被明确批评，不得反用
  source_refs:
  - XP-T-007#P067-P076
  model_refs:
  - XP-M-040

- id: XP-P-099
  title: 情景领导力：S1-S4 匹配 D1-D4，目标权永不外授
  evidence_type: explicit
  confidence: high
  statement: 领导风格按支持性行为×指导性行为分四型：S1 命令型（高指导低支持）、S2 教练型（双高）、S3 支持型（高支持低指导）、S4 授权型（双低，仅观察倾听鼓励）。员工发展阶段：D1 有意愿无能力、D2 能力升意愿降（最耗领导时间，S2 辅导次序固定：倾听→参与→反馈→指导→引导，答案从员工嘴里说出）、D3 熟事愿做新事胆怯（S3 鼓励试错）、D4 双高（S4 授权）。评估维度：知识 what、技能 how、动力、自信。对 D4 用 S1-S3 是过于管理（本质是不信任，新领导带散老团队的主因）；对 D1-D3 用 S4 是疏于管理。任何授权中目标的决定权不能授出去。
  when_to_use:
  - 一对一辅导、委派新任务、接手含资深成员的团队
  - 授权后发现失控或团队抵触时重新匹配风格
  procedure:
  - 按 what/how/动力/自信评估个人或团队所处阶段
  - 匹配对应风格，S2 严格遵循辅导次序并以引导收尾
  - 成熟一项授出一项，保持沟通频率随阶段递减
  guardrails:
  - 评估是定性判断，定错可再调，不给人贴死标签
  - 授权范围（资源权+决策权）之外的目标权、人事权仍归领导
  source_refs:
  - XP-T-007#P078-P087
  model_refs:
  - XP-M-036

- id: XP-P-100
  title: 责权利三位一体与决策：为执行而决策，集体决策个人负责
  evidence_type: explicit
  confidence: high
  statement: 责=目标（不可授权）；权=资源权+决策权（授权后再派人监督等于没授）；利=个人与组织价值共赢。决策的目的是执行而非正确：正确性由执行结果判定，决策必须带预先假定效果（即 SMART 目标，如"涨价10%拉动收入30%"），否则是假决策。要集体决策、个人负责——个人决策集体负责是最差结构；执行层要从头参与决策才认账。常规事务靠 SOP 授权一线，非常规事务领导拍板后沉淀回 SOP（少做决策）；权衡决策迟滞损失与错误决策损失；员工决策力从失败中学，领导承担试错学费并复盘常规化；流程设计用奥卡姆剃刀（如无必要勿增实体）与汉龙剃刀（信任人），一定时间内不频繁变动。
  when_to_use:
  - 设计授权与审批流程时
  - 决策久议不决或执行层不认账时
  procedure:
  - 为每项决策写下预先假定效果与测量方式
  - 让执行者参与决策全程，落单一负责人
  - 决策后复盘归类常规/非常规，沉淀 SOP
  guardrails:
  - 「与其降薪不如开人」等表述是讲师取舍观点，涉劳动法事项须另行合规核验
  - 承担试错学费不等于放任大错：重大风险事项另设停止条件
  source_refs:
  - XP-T-007#P089-P101
  model_refs:
  - XP-M-040

- id: XP-P-101
  title: 公平才有绩效：获得/付出比值、公布过程、绩效面谈五步
  evidence_type: explicit
  confidence: high
  statement: 唯有公平才有绩效；公平是一种感觉而非客观存在，公式为"我获得的÷我付出的 = 他人获得的÷他人付出的"。要公布取得绩效的过程（周报、打卡、加班时长、拜访频率等高频留痕）让除法可算；公平不是平均——平均主义宣贯一次后不再讨论，绩效必须有淘汰，管理者必须争取人事权尤其出人权，没有出口的团队会逆淘汰优秀者。绩效面谈五步（顺序固定）：目标回顾（有书面确认仪式感）→确认公平→复盘学习→下一轮目标→行动计划；频率月度或季度。可信=兑现承诺：画过的饼要拼命兑现，牺牲下属利益保位置的做法不可持续。
  when_to_use:
  - 设计或简化绩效考核体系时
  - 季度绩效面谈准备
  - 团队出现平均主义诉求时回应
  procedure:
  - 把付出过程纳入可记录、可展示的机制
  - 面谈严格按五步顺序进行，公平异议先处理再复盘
  guardrails:
  - 打卡、周报等留痕手段须服务于公平感知，沦为形式主义即失败
  - 淘汰须以绩效记录与法定程序为依据
  source_refs:
  - XP-T-007#P103-P115
  model_refs:
  - XP-M-039

- id: XP-P-102
  title: 保健因素与激励因素：底薪不动、奖金可见，金钱的边界与等效替换
  evidence_type: explicit
  confidence: high
  statement: 底薪是保健因素（密薪制、保持稳定，动一块钱都引发极大不满），奖金是激励因素（公开、可见、有仪式感；加薪加奖金不加底薪；与其降薪不如开人）。金钱激励最重要：最公平、可见、是社会标尺，不要把自己对金钱的看法等同于对金钱激励的看法。金钱解决不了的两件事：工作超量疲惫（补意义，且意义不能是空中楼阁）与角色不清任务冲突（补目标管理）。资源有限时的等效替换弹药库：晋升（平常储备、为下级谋发展、可升职加职位福利不加底薪）、信任与授权、同事关系（分工+绩效公平+淘汰）、工作本身（向"喜欢且擅长"迁移，用 S2 教练给反馈）。
  when_to_use:
  - 薪酬结构调整或员工谈加薪时
  - 预算受限时设计非金钱激励组合
  procedure:
  - 区分保健/激励两笔钱，调整只动激励因素
  - 按疲惫/角色不清两类问题分别补意义或补目标
  guardrails:
  - 薪酬操作受劳动法与公司制度约束，课程表述仅为讲师经验
  - 「抬现金发奖金」等仪式是案例叙述，落地须财务合规
  source_refs:
  - XP-T-007#P117-P128
  model_refs: []

- id: XP-P-103
  title: 管理三阶段：劳动效率（分工）→组织效率（专业化+等级制度）→个人效率（激励），递进不可倒序
  evidence_type: explicit
  confidence: high
  statement: 第一阶段靠分工提升劳动效率：新接团队先问上级期待，调研领导期待/客户需求/员工需求三方，科学划分工作元素→流程→岗位（岗位先于人，先写 JD）→配人（选择占80%）并按岗位需求培训（复盘即学习）→日常只沟通目标、授权、激励三件事→平等对待（领导绩效=团队绩效之和，不下场代工），讲师称此阶段可拉动约30%。第二阶段组织效率=专业水平+等级制度结合：权力与职位相关、职位与目标/责任相关而与薪酬待遇无关；管理本身也是专业需持续进修；责权利分配形成上升通道，为下级谋发展。第三阶段个人效率靠激励，不设上限；先有劳动效率才有支付能力（先打胜仗再打大仗），忌新官上任先列招聘计划、先扩编。传统管理者三问题：时间属于别人、不在其位不谋其政（缺系统思考）、只专注事忽视培养人。
  when_to_use:
  - 新任管理者或空降接团队的行动规划
  - 团队业绩停滞时判断处于哪个阶段、缺什么
  procedure:
  - 按"调研→要素划分→流程→岗位→配人→沟通三件事"走第一阶段
  - 用专业化与上升通道建设第二阶段，再进入个性化激励
  guardrails:
  - 「拉动30%」为讲师经验数字【材料明确表达】，不构成效果承诺
  - 三阶段是讲师综合的管理框架（含德鲁克式表述），非独立验证理论
  source_refs:
  - XP-T-007#P130-P141
  model_refs:
  - XP-M-041
- id: XP-P-104
  title: 能力与情绪的反比关系
  evidence_type: explicit
  confidence: high
  statement: 课程核心主张是处理情绪的目的是腾出时间提升能力；情绪内耗是能力提升的最大敌人，盲目茫然本身就是内耗的表现；能力越强情绪越不重要。所有情绪问题最终只能靠自己的能力解决，需要两种能力，一是解决具体情绪与工作困境的能力，二是学习和练习难东西的能力。
  when_to_use:
  - 情绪内耗占用学习与工作时间
  - 把情绪管理本身当成目的而停滞
  - 评估自己“盲目茫然”的状态
  procedure:
  - 先接纳情绪并把时间省出来
  - 为要提升的能力设定具体目标
  - 持续练习并用做出的成绩回头消化情绪
  guardrails:
  - 这是课程的核心假设与价值排序，不是已实证的心理规律
  - 不得用于否定他人真实情绪困扰或外部伤害
  - “能力越大情绪越不重要”为绝对化口号，引用时标注为来源主张
  source_refs:
  - XP-T-008#P002-P005
  - XP-T-008#P010
  - XP-T-008#P049
- id: XP-P-105
  title: 情绪创可贴两句话
  evidence_type: explicit
  confidence: high
  statement: 随时可用的情绪急救句式，第一句“什么什么是正常的”完成接纳，第二句“我需要提升什么什么能力”完成聚焦，两句连用达到一念转境的效果。
  when_to_use:
  - 任何当下情绪不适的急救
  - 第一次或近期出现的情绪状态
  procedure:
  - 命名情境并填入“……是正常的”
  - 马上补“我需要提升……能力”并尽量具体
  - 按能力项去学课、搜索或练习
  guardrails:
  - 简单易用但有效性有限，对长期重复的心理内耗不够，应换三体理论处理
  - 接纳不等于躺平，第二句不能省略
  source_refs:
  - XP-T-008#P006-P009
  - XP-T-008#P129-P130
- id: XP-P-106
  title: 接纳情绪而非对抗
  evidence_type: explicit
  confidence: high
  statement: 情绪不听理性指挥，人生最大的情绪内耗来自反抗自己的情绪；接纳情绪、刻意练习、提升能力才能进入心流。快乐与幸福是两件事，幸福是不依赖外物的内在状态。课程用《论语》首章闭环（学而时习之、有朋自远方来、人不知而不愠）作为情绪管理的循环结构。
  when_to_use:
  - 试图用理智强行压住情绪
  - 情绪反复出现自责
  procedure:
  - 体察并接纳已发生的情绪
  - 把它当作下一阶段能力提升的起点
  - 回到学而时习之式的练习循环
  guardrails:
  - 论语首章的情绪管理映射是课程解释，不是儒学标准注疏
  - 接纳不等于不采取行动
  source_refs:
  - XP-T-008#P006
  - XP-T-008#P010-P013
- id: XP-P-107
  title: 中庸四区域模型
  evidence_type: explicit
  confidence: high
  statement: 情绪按情绪高低与愉悦与否分成四区，伤病区（低情绪低愉悦，对应哀）、消极区（高情绪低愉悦，对应怒）、积极区（高情绪高愉悦，对应喜，不可持续且阈值递减）、认知区（低情绪高愉悦，对应乐）。目标是不要停在包括认知区在内的任何极端区，向中间的中庸状态走；“和”是发了脾气且恰到好处，不是不发脾气。
  when_to_use:
  - 快速定位当前情绪状态并选择行为
  - 区分自己“没情绪但不爽”与“有情绪且不爽”
  procedure:
  - 问“我现在有没有情绪、愉不愉悦”定位所在区
  - 识别对应的喜怒哀乐
  - 准备向对角线区域做动作
  guardrails:
  - 四区框架改编自课程所述“西方心理学模型”，课程未给出学术出处
  - 区域判断是自我报告，不是心理诊断
  source_refs:
  - XP-T-008#P015-P019
- id: XP-P-108
  title: 对角线牵拉
  evidence_type: explicit
  confidence: high
  statement: 用对角线区域的动作把当前极端拉回中庸。伤病区做积极区的小事（微习惯坚持、帮人、获得赞美）；消极区做认知区的学习提升；积极区把能量释放在自己“伤病”的部分（做功放电）；认知区要自尊自查、回到消极区解决困难问题防止魔怔。行动带来质量，质量带来重心；每次问自己“我下一步做什么”。
  when_to_use:
  - 已识别所在区后选择立刻可做的行为
  - 带团队时用表扬鼓励支持等激励动作帮他人牵拉
  procedure:
  - 判断当前区域
  - 选对角线区域的一个具体动作
  - 坚持做并观察状态变化
  - 每次以“下一步做什么”收尾
  guardrails:
  - 牵拉是行为调节工具，不替代专业心理治疗
  - 手工肥皂三个月走出重度抑郁的课程案例是个例，不作疗效承诺
  source_refs:
  - XP-T-008#P020-P024
  - XP-T-008#P029-P032
  - XP-T-008#P130-P132
- id: XP-P-109
  title: 都经历了才中庸
  evidence_type: explicit
  confidence: high
  statement: 中庸不是一次到位的静态标准，而是在极端间大量来回体验后找到的动态平衡；人不是在极端就是在滑向另一个极端的路上。零到十的任何落点都值得开心，因为极端是校准的原材料和财富；“结局永远是好的，如果不好说明还没结束”作为推动行动的信念使用。
  when_to_use:
  - 因结果偏离理想值而自责
  - 把中庸误解为不发脾气或平庸
  - 犹豫是否要经历困难
  procedure:
  - 主动选择进入另一个极端体验
  - 经过中点时仔细体会心理状态
  - 把每次极端记为“看过这一集”的校准素材
  guardrails:
  - “任何数都开心”是心态训练不是绩效标准
  - 结局名言的丘吉尔归属存疑，课程当信念口号使用
  source_refs:
  - XP-T-008#P025-P028
- id: XP-P-110
  title: 执其两端用其中于民
  evidence_type: explicit
  confidence: high
  statement: 对外呈现中庸、对己保持坦诚。执其两端指自己在两端都待过、体验过；用其中于民指把中间态给他人。他人落在自己极值范围内的反应都能应对；超出范围的反应视为认知扩展的机会而非冒犯，先接纳情绪再记为成长。
  when_to_use:
  - 面对他人的极端态度如批评刁难
  - 建立面对客户或下属的承受力
  procedure:
  - 盘点自己在该类事情上经历过的两端
  - 超范围刺激出现时先接纳情绪再记为扩展
  - 超出认知的事件随机应变处理
  guardrails:
  - 两端经历因人而异，未经历的领域不假装已执其两端
  source_refs:
  - XP-T-008#P031-P032
- id: XP-P-111
  title: 三体理论总纲与适用范围
  evidence_type: explicit
  confidence: high
  statement: 长期重复的心理内耗源于三个惯性模式压抑真实自我，情绪体（惯性的情绪模式）、记忆体（惯性的经验模式）、信念体（惯性的假设模式）。适用范围有明确边界，长期指三个月以上，重复指面对固定人或事反复出现、或换人换事换环境后底层形式一模一样；可用“我总是……”句型自查。短期或新近的情绪用情绪创可贴或中庸模型更合适。大量犯错却学不到东西，常因一万个错误本质是同一个错误。
  when_to_use:
  - 识别“我总是……”类反复内耗
  - 换环境后同款内耗再现
  - 决定是否值得动用三体工具
  procedure:
  - 造“我总是……”句确认长期重复
  - 拆解对应的信念（假设）、记忆（事件）和情绪
  - 分别用对应策略打破
  guardrails:
  - 三体理论出自顾及《破圈》，课程为转述应用，不得署为夏鹏原创
  - 真实自我等概念按原书语境理解，不是临床概念
  source_refs:
  - XP-T-008#P034-P037
  - XP-T-008#P077
- id: XP-P-112
  title: 情绪塑造记忆，记忆抽象为信念，信念诱发情绪
  evidence_type: explicit
  confidence: high
  statement: 人记住的是被情绪扭曲的事而非事实本身，叙述者筛选支持自己情绪合理性的事实；大量记忆堆积后被抽象概括成信念（如这个人针对我、天下老板一般黑），信念体反过来诱发情绪体形成内耗循环。打破顺序是坦诚拆解信念、回查最深刻的记忆事件并换角度理解、再检查情绪是否仍受其控制。
  when_to_use:
  - 翻旧账式争吵
  - 复盘发现叙事失真
  - 发现自己用身份标签等量代换所有个体
  procedure:
  - 把概括性判断还原成具体事件
  - 追问事件是否真是那样
  - 主动寻找被情绪遮蔽的其他事实
  guardrails:
  - 记忆被情绪扭曲是课程对记忆可靠性的立场，程度因人因事而异，不等于所有记忆都失真
  source_refs:
  - XP-T-008#P043-P044
- id: XP-P-113
  title: 假设未必成真
  evidence_type: explicit
  confidence: high
  statement: 信念的本质是惯性假设，“假”字即条件预设、未必成真；所有假设本质是可能性而非必然性。把可能性当必然性、把假设当论断，是逻辑不好和情绪问题的共同来源。争论双方都去掉“未必”各执真假时谁都不对；靠谱的做法是承认对方假设可能对，同时抛出自己的假设去试。信念牢不可破即固执；真正有原则的人通常只在一件事上坚持。
  when_to_use:
  - 拆解自己的限制性信念
  - 陷入因为A所以一定B式推断
  - 遇到固执的沟通对象
  procedure:
  - 找出判断背后的前提句
  - 标注它未必成真
  - 设计小试验验证而不是争论
  guardrails:
  - 课程对假设与论断的讲解是通俗版，不替代形式逻辑训练
  - 未必成真与可能为假的等值表述在课程口播中存疑，引用时以“可能性而非必然性”为准
  source_refs:
  - XP-T-008#P039-P042
- id: XP-P-114
  title: 深刻的体验打破情绪体
  evidence_type: explicit
  confidence: high
  statement: 打破情绪体的方式是深刻的体验。多数人只用抽象词（emo、PUA）概括情绪，语言退化导致情绪感知失真；具体化方法是给情绪零到十打分并追问为什么是这个分，把模糊叙述追问成具体事件。三个练习为有意识地添加不适（培养自信与情绪感受力）、不麻木地对待日常（觉得不对就带着好奇提具体问题）、不逃避地体验逆境（与负面情绪共舞而非对抗，锻炼心力）。
  when_to_use:
  - 情绪模糊说不清
  - 长期回避不适
  - 想提升自信与情绪颗粒度
  procedure:
  - 每周主动做一件让自己不适的挑战性的事
  - 对不对劲的日常提出具体问题而不是算了
  - 逆境来了停住体验并给感受命名打分
  guardrails:
  - 有意识添加不适指可控的挑战性练习，不是自残或超出承受力的伤害
  - 亚里士多德勇气名言归属待核
  source_refs:
  - XP-T-008#P045-P049
- id: XP-P-115
  title: 透彻的思考打破记忆体
  evidence_type: explicit
  confidence: high
  statement: 打破记忆体的方式是透彻的思考，由追问和切分组成。追问用五W两H纵向五个层次，一问一答往来约五次即可还原事实，因为人在情绪中语言含糊抽象；切分把句子的核心词拆开逐个定义（我、父亲、关系、不好各是什么、什么程度、有无转机）。该方法同时适用于问题诊断、复盘和领导力。
  when_to_use:
  - 被某个旧事萦绕心中
  - 对方叙述全是抽象概括
  - 复盘与根因分析
  procedure:
  - 对概括句逐层追问何时、怎么、为什么、程度、他人、责任
  - 把句子切成关键词逐个定义
  - 追问与切分连续使用
  guardrails:
  - 课程同时主张复盘问学到什么而非揪原因，两者用途不同，追问用于还原具体事实，复盘用于提取学习，不矛盾
  source_refs:
  - XP-T-008#P050-P052
  - XP-T-008#P098
- id: XP-P-116
  title: 持续的实践打破信念体
  evidence_type: explicit
  confidence: high
  statement: 打破信念体的方式是持续的实践，核心句是试一次远远不够；“但是”后面的信息只是假设不是事实，试完才能收到新的结果。持续实践五要素为清晰的目标（SMART）、被验证的方法、超出当下能力的练习（成功经验加个人变通）、全力投入、及时反馈（结果与目标的差距是下一轮起点）。目的是让原有信念松动、能力自然上升。
  when_to_use:
  - 试过一次被拒就放弃
  - 用“但是”预判结果
  - 想系统性改变一个信念
  procedure:
  - 定SMART目标
  - 用已验证方法加个人变通执行
  - 全力投入并记录结果
  - 对照目标找差距进入下一轮，多轮后再下结论
  guardrails:
  - 被验证的方法仍需结合具体情境评估
  - 全力投入不等于不加停止条件
  source_refs:
  - XP-T-008#P053-P055
- id: XP-P-117
  title: 刺激选择回应
  evidence_type: explicit
  confidence: high
  statement: 在刺激与回应之间加入选择，是人与本能的区别；跟随本能（渴了就喝、被骂就怒）最容易也最消极。沙漠一瓶水思想实验展示三个层次，让水是克服一次本能的自由选择，对方喝光后体谅是克服二次本能，发怒后主动道歉是对逃避冲突本能的二次纠偏。自由的本质是能选，任何时候都有选择；聪明是天生的，善良是选择的。快思考即本能，慢思考即加入选择。
  when_to_use:
  - 被刺激立刻想回应
  - 犹豫是否道歉或面对冲突
  - 把现状归因于环境
  procedure:
  - 感受刺激后暂停一下
  - 列出至少两个可选回应
  - 选择并承担代价
  - 对本能造成的问题做二次纠偏
  guardrails:
  - 概念关联史蒂芬·柯维的高效能人士七个习惯（事物被创造两次），课程为其应用展开
  - 不用于要求他人无底线忍让
  source_refs:
  - XP-T-008#P058-P063
- id: XP-P-118
  title: 习得性无助句式
  evidence_type: explicit
  confidence: high
  statement: “因为A，所以我做不到B”的句式不成立，A可以被改变，且不存在从A到B的必然性（没读好学校不等于升不了职，三十五岁不等于危机，信号不好就换手机）。职场可信的回应不是讲做不到的理由，而是我可以试一试、我需要什么支持和条件；条件被拒就设计下一个条件，目标是要做成事而不是纠结条件。
  when_to_use:
  - 迷茫叙述都从背景开始
  - 用原生家庭学历年龄解释现状
  - 下属汇报只讲理由
  procedure:
  - 把因为所以句式改成要达成B我需要什么条件
  - 把不可控条件列为待创造项
  - 主动创造条件而非等待
  guardrails:
  - 习得性无助概念源自塞利格曼，课程为通俗应用版；识别句式不等于否定真实资源约束，条件创造仍需现实评估
  source_refs:
  - XP-T-008#P003
  - XP-T-008#P063
  - XP-T-008#P080
- id: XP-P-119
  title: 自由选择的四个维度
  evidence_type: explicit
  confidence: high
  statement: 在刺激与回应之间做选择的四条路径。自我意识，清楚我喜欢什么擅长什么，是职业与关系选择的前提；想象力，用“还有什么可能”“为什么不能”扩展选项，匮乏才能激发想象力，带人时给明确目标、抽走资源以激发想象；良知，问牛人或圣贤在此场景会做什么，向榜样看齐，与道德无关；独立意志，经过反思的选择愿意承担后果，我就是我也是一种选择。
  when_to_use:
  - 职业迷茫觉得没有选择
  - 需要突破条件限制
  - 需要决断力
  procedure:
  - 依次自问我喜欢擅长什么、还有什么可能、榜样会怎么做、我是否愿意承担代价
  guardrails:
  - 王阳明吾性具足的口播写法存疑（通行作吾性自足）
  - “理由永远可以被消灭”是激励性夸张，重大决策需独立评估
  source_refs:
  - XP-T-008#P064-P072
- id: XP-P-120
  title: 少谈感受采取行动，关注目标而非细节
  evidence_type: explicit
  confidence: high
  statement: 日常刻意练习的两条原则。少谈感受采取行动，情绪创可贴两句本质就是这八个字；关注目标而非细节，用想象出来的未来细节（打车安不安全、司机累不累）阻碍当下行动会产生畏难情绪，反复讨论不可控细节可能是有意回避行动与失败。冲起来，逢山开路遇水架桥，每一步调整。
  when_to_use:
  - 反复讨论感受而没有行动
  - 用细节完备性拖延启动
  procedure:
  - 把讨论从感受切换到下一步做什么
  - 只解决眼前问题
  - 为行动设定最小启动步
  guardrails:
  - 细节讨论可能有逃避功能是课程结合阿德勒目的论的解读，不是动机指控
  source_refs:
  - XP-T-008#P072-P073
- id: XP-P-121
  title: 三类问题与影响力
  evidence_type: explicit
  confidence: high
  statement: 问题分三类采取不同动作。直接可控的问题，立刻改变自己的行为与视角；间接可控的问题，施加影响力，影响力的构建是出承诺且信守承诺，说做到重复多次后说话有人跟；无法控制的问题，不予考虑。抓住直接可控的问题持续做，影响力扩大后无法控制的边界会缩小。
  when_to_use:
  - 问题分类与精力分配
  - 建立个人或管理影响力
  - 纠结宏观环境时
  procedure:
  - 列问题清单按三类标注
  - 直接可控项立刻行动
  - 间接可控项靠承诺与兑现积累影响力
  - 不可控项明确放下
  guardrails:
  - 影响力构建是长期重复过程，一次失信即受损
  - 边界缩小是课程的趋势判断
  source_refs:
  - XP-T-008#P073-P074
- id: XP-P-122
  title: 目标决定行为而不是过去的经历
  evidence_type: explicit
  confidence: high
  statement: 阿德勒个体心理学的一句话概括，目标决定我们的行为，而不是过去的经历。弗洛伊德式宿命论（现在由过去堆叠决定）导向被动与原生家庭叙事；想清楚到底要什么，很多心理内耗会被治愈。活在过去的人抑郁，活在将来的人焦虑，活在当下的人自洽；对未来走一步看一步，不用未发生的细节限制现在的选择。咨询不问背景问目标，有了目标就能做差距分析。
  when_to_use:
  - 叙述从背景或原生家庭开始
  - 反复复盘过去
  - 焦虑未来细节
  procedure:
  - 用“我想……但现在……”界定目标与现状
  - 对目标做SMART与差距分析
  - 从现状推出需要做什么
  guardrails:
  - 阿德勒立场是课程式对比，不构成对创伤影响的否定
  - “瞬间被治愈”为修辞性夸张
  source_refs:
  - XP-T-008#P076-P082
- id: XP-P-123
  title: 自卑感与优越感是两大动力体
  evidence_type: explicit
  confidence: high
  statement: 在阿德勒体系内（非日常褒贬义），人人都自卑，因为对现状不满意、期待更好；自卑感是现状，给动力；优越感来自与某人或某状态的对比，给方向，必须翻译成具体目标才有引领作用。目标一旦具体（可描述、可测量、能达到、相关、有时间表），自卑感就转化为动力。示例包括二舅治愈内耗、中产奢侈品划界限、微商喜提玛莎拉蒂与私人飞机的炫耀性目标激励。
  when_to_use:
  - 自卑感袭来
  - 把羡慕变成可行动的方向
  - 设计激励包括金钱激励
  procedure:
  - 接纳自卑并写下期待
  - 找到具体的参照对象或状态
  - 把它翻译成SMART目标并排时间表
  - 想象达成后的状态
  guardrails:
  - 优越感与自卑感是阿德勒的学术用法，不等于日常攀比话术
  - 炫耀性激励案例是商业观察，含营销成分；金钱激励观点为来源主张，与对金钱的喜好是两件事
  source_refs:
  - XP-T-008#P078
  - XP-T-008#P083-P090
- id: XP-P-124
  title: 好目标三标准SMART聚焦取舍
  evidence_type: explicit
  confidence: high
  statement: 好目标有三个标准。一是符合SMART；二是单一，资源永远有限，目标过多导致资源匮乏感与焦虑，删减目标让资源充足（CEO收缩战线砍副线救公司；改变物体形状的不是压力而是压强，单点突破加大力出奇迹）；三是会取舍，所有二难选择源于双重目标、多样标准、既要又要还要，简化标准后选项自动浮现（两个都好闭眼选，两个都不好赶紧换，一好一坏选好的，没有选项就创造选项）。
  when_to_use:
  - 目标逾期推进不下去
  - 时间钱社交不够用
  - 二难选择纠结
  procedure:
  - 目标过SMART检查
  - 删到单一目标
  - 对账单、时间、社交清单做减法
  - 二难选择先简化标准再看选项
  guardrails:
  - “所有二难选择都是脑子不清楚”是激励性判断
  - 删减目标应保留基本安全与健康底线
  source_refs:
  - XP-T-008#P089-P093
- id: XP-P-125
  title: 问题等于目标与现状的差距
  evidence_type: explicit
  confidence: high
  statement: 定义问题的句型是“我想……”（目标，过SMART）加“但现在……”（现状，陈述即可），两者之差即问题。目标不清晰的问题无法行动，想谈恋爱不如想相亲，目标清晰者少内耗；问对了问题（你到底想要什么），答案自然浮现。GROW模型（目标、现状、选项、下一步）同构，可给下属用也可给自己用，让对方自己想清楚则执行有劲。
  when_to_use:
  - 描述困难全是背景没有问题
  - 帮下属或自己理清困境
  - 目标模糊的内耗
  procedure:
  - 造“我想……但现在……”句
  - 把我想部分SMART化
  - 陈述现状
  - 对差距列选项并定下一步
  guardrails:
  - GROW为教练模型在课程中的引用
  - 答案自然浮现以目标可具体化为前提
  source_refs:
  - XP-T-008#P094-P095
- id: XP-P-126
  title: 社会化身份规则与交换
  evidence_type: explicit
  confidence: high
  statement: 成年人进入社会化会获得身份并按身份要求的规则行事；规则本质是提升群体效率，阻碍效率的规则应被改变；社会化的底层是交易与交换，没有谁只付出不获得，认清交换本质可消解人际情绪。社交按邓巴数做减法（最内圈约五人，同一段最多一百五十人），对彼此无价值的社交不必强撑；理想主义者交换的也是认同。
  when_to_use:
  - 人际关系带来情绪内耗
  - 社交圈过度扩张
  - 解释职场来往的本质
  procedure:
  - 按身份明确规则与交易内容
  - 对社交清单分级
  - 无交易价值且内耗的连接逐步退出
  guardrails:
  - “本质是交易”是课程的解释框架，不否定情感性关系的存在
  - 做减法不是功利性断亲，课程对三观一致者明确例外
  source_refs:
  - XP-T-008#P100-P104
- id: XP-P-127
  title: 奥卡姆剃刀做减法
  evidence_type: explicit
  confidence: high
  statement: 人际与事务做减法的第一把剃刀，如无必要勿增实体。能用现有资源解决就不新增实体（车还能通勤就不换新车，新增带来一连串决策成本）；对带来价值小、情绪成本大的人写名单逐步退出；对自己的需求先问“真的需要吗、不满足会怎样”（三年没涨薪要的可能是认可度不是涨薪）；管好自己不折腾，也划清界限不让他人折腾。
  when_to_use:
  - 想通过加新东西解决旧问题
  - 强行维护低价值社交
  - 需求真实性存疑
  procedure:
  - 想增加前先判断必要性
  - 列内耗人员名单评估影响并退出
  - 对需求做真实性与影响双问
  guardrails:
  - 如有必要仍要增实体，剃刀判断的是必要性，不是一味极简
  source_refs:
  - XP-T-008#P105-P107
- id: XP-P-128
  title: 汉龙剃刀不揣度动机
  evidence_type: explicit
  confidence: high
  statement: 第二把剃刀，他人把事办砸时，解释为信息不足、能力不匹配或岗位不适合，而不解释为坏。动机无法验证，君子论迹不论心；一旦争论动机，讨论就变成立场之争而非事实辨析。教育反例是揪“你是不是故意的”让孩子委屈反抗；人不知而不愠即手持此刀。
  when_to_use:
  - 被冒犯后归因
  - 绩效反馈
  - 对方行为反常
  procedure:
  - 把“他为什么针对我”改写为发生了什么、缺什么信息、能力还是匹配问题
  - 就行为与事实沟通
  - 需要时用沟通验证推断
  guardrails:
  - 剃刀是归因的默认设置，不等于无视真实恶意与边界侵害，安全场景仍要止损
  source_refs:
  - XP-T-008#P108-P109
- id: XP-P-129
  title: 利他是起点也是方法
  evidence_type: explicit
  confidence: high
  statement: 与他人协作的心法是无私生智、有信则猛，打小算盘想不清时把算盘扔掉方法就出来。利他是起点和方法（先交出第一张牌），终点是否利己不由自己控制，所以不谈利己终点而持有“结局永远是好的”式行动信念。判断信念好坏的标准是能否让你产生行动和勇气（信念本身可以不符合逻辑）。配套要点为利己我执是很多痛苦的来源；要有被讨厌的勇气，纯粹利他效率最高；做自己擅长的事也让别人做他擅长的事，双方都擅长才形成交易；世界由动词建立，行动创造世界。
  when_to_use:
  - 合作算计卡壳
  - 害怕付出吃亏
  - 因在意评价不敢行动
  procedure:
  - 先按“只要不亏就能干”交出第一张牌
  - 亏了不揣测动机，调整或退出
  - 持续利他并观察长期回报
  - 把自己和他人放在擅长位
  guardrails:
  - “终点必然利己”是无逻辑保证的信念，课程明确其不符合逻辑
  - 利他不等于无止损条件的付出
  source_refs:
  - XP-T-008#P110-P118
  - XP-T-008#P137
- id: XP-P-130
  title: 情绪都是自己造成的与六脉神剑总纲
  evidence_type: explicit
  confidence: high
  statement: 课程收尾命题是情绪都是自己造成的、与他人无关、他人无法帮忙，只有通过自己的努力才能改变情绪状态；只要想改变就一定能改变，是意愿问题而路径已画清。六讲心法六个关键词（情绪六脉神剑）为能力、体验、追问、选择、目标、利他；遇到情绪时看哪个关键词能让当下稳定，然后回到能力提升。
  when_to_use:
  - 把情绪归因他人
  - 需要快速选用哪一讲的方法
  procedure:
  - 承担情绪的自我责任
  - 按问题时间尺度选工具（当下创可贴、近期中庸、长期三体、条件选择、未来目标、人际利他）
  - 每次以行动收尾
  guardrails:
  - “都是自己造成的”是课程的赋权式归因，用于自我负责，不用于受害归责或否定外部伤害与霸凌
  - “一定能改变”是意愿性主张
  source_refs:
  - XP-T-008#P118-P119
  - XP-T-008#P129-P137
- id: XP-P-131
  title: 话语分析分离事实情绪与推断
  evidence_type: explicit
  confidence: high
  statement: 复习课展示的文本分析方法。程度词（明显、每天）和否定词加形容词（不爽、不开心）往往承载情绪而非事实；重复出现的词（爆炸、经常性）标记情绪重点；故事即记忆体，记忆被情绪塑造故叙述失真。“明显感到敌意”是情绪，“不打招呼”才是事实；推断（领导不爽）需通过沟通验证。方法适用于倾听他人与自我觉察，把别人的信息解码成需求。
  when_to_use:
  - 复盘他人叙述
  - 咨询与连麦场景
  - 自我日记觉察
  procedure:
  - 划出程度词、否定词、重复词并标注为情绪
  - 提取可核验的事实句
  - 把推断列为待验证假设
  - 用沟通验证而不是争论
  guardrails:
  - 语言线索是启发式，不是测谎，不用于对他人做动机指控
  source_refs:
  - XP-T-008#P122-P125
  - XP-T-008#P133-P135
- id: XP-P-132
  title: 期待落空与归因
  evidence_type: explicit
  confidence: high
  statement: 第二次情绪波动常来自第一次付出形成的隐含期待（我让水则你该留一半或道谢），期待落空后被归因成他人敌意。送礼、请客、帮忙是释放“我是好人”的信号，信号不保证回信；人情债一把一利索，若要未来回报应在给出时说清楚需要什么。
  when_to_use:
  - 付出后失望
  - 用善意绑定他人
  - 社交中的隐含契约
  procedure:
  - 付出前问自己是否有期待
  - 有期待就明说需求
  - 无回报也不揣测动机，用行为决定下一步
  guardrails:
  - 期待管理针对自己的付出，不用于要求他人必须回报
  source_refs:
  - XP-T-008#P123
  - XP-T-008#P128
