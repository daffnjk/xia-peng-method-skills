- id: XP-P-001
  title: 三层工作结构
  evidence_type: explicit
  confidence: high
  statement: 智能体的工作被概括为“大模型 + 自模型 + 数据源”；其中大模型被调用，自模型和数据源决定调用方式与上下文。
  when_to_use:
  - 设计智能体总体架构
  - 排查回答宽泛或缺少个性化的原因
  procedure:
  - 明确底层模型负责生成
  - 用 Skill/Agent/Workflow 封装任务方式
  - 接入经授权的数据源
  guardrails:
  - “自模型”是本材料中的自定义术语，不等同于通用学术定义
  - 不要把平台能力类比当作性能事实
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P006-P011
  - XP-T-001#P023-P024
- id: XP-P-002
  title: 自模型是方法与流程的封装
  evidence_type: explicit
  confidence: high
  statement: 材料把 Skill、Agent、Workflow 统称为“自模型”，强调它们是调用大模型的杠杆。
  when_to_use:
  - 把重复任务产品化
  - 把个人经验变成可复用流程
  procedure:
  - 先确定任务场景
  - 选择 Skill、单 Agent 或多 Agent 工作流
  - 把约束、步骤和迭代规则写入
  guardrails:
  - 该分类是来源内部框架；对外产品文档应解释术语
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P007-P010
- id: XP-P-003
  title: 先让智能体懂你
  evidence_type: summarized
  confidence: high
  statement: 个性化智能体应先建立对用户经历、优势、偏好、工作环境和目标的结构化理解，再给建议或执行任务。
  when_to_use:
  - 职业建议
  - 目标管理
  - 简历与规划
  - 副业评估
  procedure:
  - 收集获授权的个人资料
  - 区分事实、用户自述和模型推断
  - 建立可更新的用户画像
  - 回答前检索相关画像
  guardrails:
  - 只收集任务所需数据
  - 用户画像中的推断不得写成事实
  - 敏感信息应最小化与分级存储
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P026-P041
  - XP-T-001#P075-P081
- id: XP-P-004
  title: 用真实世界材料建立上下文
  evidence_type: explicit
  confidence: high
  statement: 材料建议使用简历、自我介绍、MBTI、盖洛普、周报/年终总结、读书材料、录音和视频等作为数据源。
  when_to_use:
  - 初始化个人智能体
  - 补充组织与项目上下文
  procedure:
  - 建立资料清单
  - 记录来源、日期与权限
  - 将原始材料和归纳结果分开存储
  - 定期复核
  guardrails:
  - 人格测评只能作为参考，不作为确定性诊断
  - 不得默认所有历史对话都会被平台永久保存
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P011-P014
  - XP-T-001#P028-P036
- id: XP-P-005
  title: 频率等于效率
  evidence_type: explicit
  confidence: medium
  statement: 材料把高频互动视为智能体更懂用户、使用效率更高的关键，并倡导“有问题问智能体”和每日/每周总结。
  when_to_use:
  - 培养使用习惯
  - 建立持续用户日志
  procedure:
  - 优先把问题记录给智能体
  - 每天或每周输入工作总结
  - 把可复用事实写入结构化画像
  - 定期清理噪声和过期信息
  guardrails:
  - 这是来源中的经验法则，不是数学定律
  - 只有平台确实保存并可检索的数据才会形成长期上下文
  - 高频低质量数据可能造成污染
  source_refs:
  - XP-T-001
  - XP-T-002
  legacy_source_refs:
  - XP-T-001#P014-P024
  - XP-T-002#P003-P004
- id: XP-P-006
  title: 数据量与充分列举
  evidence_type: explicit
  confidence: medium
  statement: 材料强调提供足够数据，并在设计 Skill 时尽量多列举场景、痛点和结果，以便模型识别规律。
  when_to_use:
  - 构建用户画像
  - 明确场景边界
  - 生成需求分类
  procedure:
  - 先广泛列举
  - 再去重和分组
  - 标出高频与高影响项
  - 用反例检查覆盖
  guardrails:
  - 数量不能替代数据质量、相关性和隐私控制
  - 最终执行层仍需收敛优先级
  source_refs:
  - XP-T-001
  - XP-T-002
  legacy_source_refs:
  - XP-T-001#P028-P036
  - XP-T-002#P027-P033
- id: XP-P-007
  title: 把智能体当作需要充分交代背景的同事
  evidence_type: explicit
  confidence: high
  statement: 材料用“把智能体当成人”的比喻，核心操作含义是先介绍自己、目标和环境，再安排工作。
  when_to_use:
  - 首次协作
  - 任务复杂或跨资料
  procedure:
  - 说明角色关系
  - 给出背景材料
  - 定义任务与成功标准
  - 确认缺失信息
  guardrails:
  - 这是交互比喻，不应把模型描述成真人或具有人格权利
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P026-P028
  - XP-T-001#P037-P041
- id: XP-P-008
  title: 语音优先与先试再说
  evidence_type: explicit
  confidence: medium
  statement: 材料鼓励用口述降低表达门槛，并在不确定智能体能否完成时先提出要求、再根据结果调试。
  when_to_use:
  - 快速外化想法
  - 低风险原型
  - Skill 初稿
  procedure:
  - 口述目标与约束
  - 让模型整理结构
  - 检查歧义与事实
  - 迭代修正
  guardrails:
  - 高风险操作不能仅靠“先试”
  - 语音识别错误必须校验专有名词、数字与权限
  source_refs:
  - XP-T-001
  - XP-T-002
  legacy_source_refs:
  - XP-T-001#P041-P046
  - XP-T-002#P021-P022
- id: XP-P-009
  title: 跨材料建立联系
  evidence_type: explicit
  confidence: high
  statement: 智能体的价值之一是同时读取多份材料并建立关联，例如把优势测评与周报、客户访谈与历史案例结合。
  when_to_use:
  - 职业规划
  - 客户方案
  - 汇报与投标
  - 知识综合
  procedure:
  - 为材料标注类型和时间
  - 先提取事实再做跨文档关联
  - 保留证据链接
  - 对冲突信息显式提示
  guardrails:
  - 关联不等于因果
  - 不能凭相似词自动合并不同主体或时期
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P050-P055
- id: XP-P-010
  title: 建议必须个性化、具体、可落地
  evidence_type: explicit
  confidence: high
  statement: 材料要求后续建议基于对用户的充分了解，避免假大空，除非用户明确要求不使用个人上下文。
  when_to_use:
  - 建议类回答
  - 职业规划
  - 项目方案
  procedure:
  - 调用相关用户事实
  - 写明目标、动作、责任人、时间和指标
  - 指出前提与缺失信息
  - 提供下一步
  guardrails:
  - 不得用未经确认的画像推断替代事实
  - 用户可选择关闭个性化
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P075-P081
- id: XP-P-011
  title: 画像与成果持续更新
  evidence_type: explicit
  confidence: medium
  statement: 材料提出按周更新“关于我”，按季度基于互动与项目更新简历。
  when_to_use:
  - 长期个人智能体
  - 职业档案维护
  procedure:
  - 每周汇总新增事实与变化
  - 用户审核后写入画像
  - 每季度抽取可证明成果
  - 生成简历候选变更
  guardrails:
  - 自动更新前应获得授权
  - 简历成果必须可核验，不能把计划当结果
  source_refs:
  - XP-T-001
  legacy_source_refs:
  - XP-T-001#P075-P081
- id: XP-P-012
  title: 场景型 Skill 优先于风格型 Skill
  evidence_type: explicit
  confidence: high
  statement: 材料反对只规定“苏格拉底式/马斯克式”等表达风格而不说明任务，主张明确 Skill 在什么场景解决什么问题。
  when_to_use:
  - 新建 Skill
  - 评审提示词是否可执行
  procedure:
  - 写明触发场景
  - 定义用户痛点
  - 定义理想结果
  - 列出边界与禁用场景
  guardrails:
  - 风格可以作为次级约束，但不能代替任务结构
  source_refs:
  - XP-T-002
  - XP-T-003
  legacy_source_refs:
  - XP-T-002#P008-P012
  - XP-T-003#P083-P084
- id: XP-P-013
  title: Skill 第一步：场景、痛点、结果
  evidence_type: explicit
  confidence: high
  statement: 明确问题时至少回答：在什么情境调用、当前痛点是什么、成功后的结果或“爽点”是什么。
  when_to_use:
  - 任何场景型 Skill
  procedure:
  - 列举触发情境
  - 列举失败/摩擦点
  - 列举成功输出
  - 按优先级和频率归类
  guardrails:
  - 结果应可观察或可验证，避免只有情绪形容词
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P024-P033
  - XP-T-002#P038-P041
- id: XP-P-014
  title: Skill 第二步：装入思维模型
  evidence_type: explicit
  confidence: high
  statement: 解决问题时应显式提供适用的思维模型；模型越成熟，沟通可以越高密度。
  when_to_use:
  - 已有专业方法的任务
  - 希望稳定复现专家判断
  procedure:
  - 列出模型名称
  - 说明各模型适用条件
  - 定义组合顺序与冲突处理
  - 用案例校验
  guardrails:
  - 只写模型名称但没有定义或来源，可能造成模型误用
  - 现有逐字稿未提供多数模型的完整定义
  source_refs:
  - XP-T-002
  - XP-T-003
  legacy_source_refs:
  - XP-T-002#P012-P017
  - XP-T-002#P042-P047
  - XP-T-003#P067-P070
- id: XP-P-015
  title: 思维模型不足时拆步骤
  evidence_type: explicit
  confidence: high
  statement: 如果没有足够成熟的思维模型，就要把解决问题的流程拆成明确的一、二、三步；模型充分时可省略这一层。
  when_to_use:
  - 新领域 Skill
  - 隐性经验尚未模型化
  procedure:
  - 列出输入
  - 拆解关键动作
  - 定义每步输出与检查点
  - 标明失败分支
  guardrails:
  - 四步或五步不是固定教条，取决于模型与任务复杂度
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P014-P021
  - XP-T-002#P042-P047
- id: XP-P-016
  title: 加入第零步与后一步
  evidence_type: explicit
  confidence: high
  statement: Skill 不只处理核心任务，还要定义开始前需要的情境信息，以及完成后如何落实、沉淀和进入下一环节。
  when_to_use:
  - 把单次提示词升级为工作流
  - 减少任务突兀与断点
  procedure:
  - 列出前置上下文
  - 定义信息缺口获取方式
  - 定义完成后的存档/复盘/跟踪
  - 指定下游接收者
  guardrails:
  - 不要让后一步自动执行不可逆操作，除非有明确授权
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P017-P020
  - XP-T-002#P048-P052
- id: XP-P-017
  title: 建立人机相互迭代
  evidence_type: explicit
  confidence: high
  statement: Skill 应让用户从输出中提升能力，也让智能体从用户复盘和存档中更新对个人与组织的理解。
  when_to_use:
  - 长期 Skill
  - 目标管理
  - 教练与学习
  procedure:
  - 记录结果与反馈
  - 周期性总结用户长短板
  - 用户审核后更新画像
  - 将新知识反馈到 Skill 版本
  guardrails:
  - 反馈不等于真理，必须区分偏好、事实和结果数据
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P053-P057
- id: XP-P-018
  title: 没有标准答案，但有质量标准
  evidence_type: explicit
  confidence: medium
  statement: 材料主张 Skill 设计没有唯一标准答案，但优质参考应覆盖充分，尤其要尽量多列举场景、痛点和结果。
  when_to_use:
  - 评审多个 Skill 方案
  - 鼓励自主设计
  procedure:
  - 生成多个候选
  - 按覆盖、可执行性、边界和证据评分
  - 合并优点
  - 用测试题验证
  guardrails:
  - “多”只是一个标准，还需正确性、简洁性和安全性
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P027-P033
- id: XP-P-019
  title: 用独立项目隔离上下文
  evidence_type: explicit
  confidence: medium
  statement: 材料建议每个 Skill 或工作项目使用独立对话/项目，减少上下文混乱。
  when_to_use:
  - 多项目并行
  - 多 Skill 开发
  procedure:
  - 为项目建立稳定 ID
  - 只挂载相关资料与角色
  - 跨项目共享内容通过审核的知识卡传递
  guardrails:
  - 这是上下文管理策略，不代表平台一定完全隔离数据
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P034-P037
- id: XP-P-020
  title: 目标管理先补情境智慧
  evidence_type: explicit
  confidence: high
  statement: 目标拆解前要了解组织战略、领导风格、个人优势劣势、同事构成与人际关系。
  when_to_use:
  - 领导布置任务
  - 跨团队目标对齐
  - 周月复盘
  procedure:
  - 检索组织目标
  - 确认领导偏好和汇报方式
  - 检查个人能力与资源
  - 识别关键协作关系
  guardrails:
  - 人际关系信息应谨慎处理，避免未经证实的评价
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P048-P052
  - XP-T-002#P063-P071
- id: XP-P-021
  title: 目标管理要确认指标口径
  evidence_type: summarized
  confidence: high
  statement: 示例中先确认“50 万营收”是签约额还是到账额，再拆关键路径、资源与节奏。
  when_to_use:
  - 数字目标
  - 营收、增长、交付指标
  procedure:
  - 确认指标定义
  - 确认基线和时间窗
  - 确认负责人和依赖
  - 再做分解
  guardrails:
  - 模型不得自行补造业务数据
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P069-P074
- id: XP-P-022
  title: 目标管理结果要沉淀
  evidence_type: explicit
  confidence: high
  statement: 目标完成后要提交周报、追踪项目、复盘、沉淀个人作品和知识库，而不是输出完即结束。
  when_to_use:
  - 项目收尾
  - 绩效复盘
  - 个人知识管理
  procedure:
  - 记录目标与实际结果
  - 分析差距
  - 提炼规律
  - 更新作品集和知识库
  guardrails:
  - 只记录已完成、可证明的成果
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P049-P057
  - XP-T-002#P075-P076
- id: XP-P-023
  title: 按功能划分 Agent：Collector、Planner、Doer
  evidence_type: explicit
  confidence: high
  statement: 多 Agent 系统可按“搜集信息、出主意、干活”三类功能分工；同一类可有多个 Agent，角色也可复合。
  when_to_use:
  - 一人公司
  - 副业系统
  - 复杂项目
  procedure:
  - 列出项目所需信息、决策和执行
  - 把每项职责映射到角色
  - 定义输入输出和交接协议
  guardrails:
  - 角色数量应由任务复杂度决定，不为多 Agent 而多 Agent
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P003-P008
  - XP-T-003#P023-P026
- id: XP-P-024
  title: 按问题选择角色
  evidence_type: explicit
  confidence: high
  statement: 不知道别人怎么做时用 Collector；不知道自己怎么做时用 Planner；知道怎么做但需要执行时用 Doer。
  when_to_use:
  - 任务路由
  - 确定首个 Agent
  procedure:
  - 判断信息缺口、方案缺口或执行缺口
  - 选择主角色
  - 必要时串联其他角色
  guardrails:
  - 实际任务常同时包含三种缺口
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P005-P010
- id: XP-P-025
  title: 基础工作流：信息→想法→执行→结果
  evidence_type: explicit
  confidence: high
  statement: 最小多 Agent 链路是 Collector 产出信息，Planner 形成方案，Doer 执行，结果交给人或进入下一轮。
  when_to_use:
  - 多 Agent MVP
  - 自动化前的试跑
  procedure:
  - 定义每一段的结构化交付物
  - 设置验收门槛
  - 失败时允许向上游回退
  guardrails:
  - 没有验收标准的串联只会放大错误
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P031-P036
- id: XP-P-026
  title: 先试跑，再选择人在环上还是环中
  evidence_type: explicit
  confidence: high
  statement: 材料区分三种阶段：先用单轮试跑验证链路；重大事项由人做关键判断后再启动；低风险可让系统多轮自迭代、人负责监督。
  when_to_use:
  - 决定自动化程度
  - 风险分级
  procedure:
  - 先运行 1.0 链路
  - 评估错误成本和可逆性
  - 高风险用 Human-in-the-loop
  - 低风险且可观测时用 Human-on-the-loop
  guardrails:
  - 原转写术语存在识别歧义；这里按其定义工程化归一
  - 不可逆、高风险和对外发布默认需要人工审批
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P033-P039
- id: XP-P-027
  title: 多 Agent 沟通必须明确寻址
  evidence_type: explicit
  confidence: medium
  statement: 在来源使用的平台中，多 Agent 项目需要明确 @ 对应角色，否则任务可能不被接收。
  when_to_use:
  - 同一项目存在多个 Agent
  procedure:
  - 每个任务写明接收者
  - 群体任务写明全体角色
  - 记录任务状态与确认回执
  guardrails:
  - 这是平台相关操作，不应推广成所有系统的通用事实
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P027-P030
- id: XP-P-028
  title: 用外部案例与知识增强判断
  evidence_type: explicit
  confidence: high
  statement: 在工作流已有初版后，可加入案例、模型和知识材料，让 Planner 重新评估并产生新版本。
  when_to_use:
  - 商业计划迭代
  - 知识密集型决策
  procedure:
  - 标注外部材料来源
  - 提取适用模型
  - 说明与当前项目的对应关系
  - 输出变化前后差异
  guardrails:
  - 案例类比不等于当前项目一定成立
  - 必须检查来源质量和适用条件
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P075-P085
  - XP-T-003#P091-P093
- id: XP-P-029
  title: 判断力决定 Skill 上限
  evidence_type: explicit
  confidence: high
  statement: 材料认为工具操作容易，真正拉开差距的是领域经验、判断力与思维模型储备。
  when_to_use:
  - 评估 Skill 质量
  - 决定何处需要专家参与
  procedure:
  - 盘点现有模型和案例
  - 识别判断盲区
  - 引入领域专家或高质量资料
  - 把判断标准写入评测
  guardrails:
  - 模型数量不等于模型质量
  - 外部知识不能替代责任主体
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P060-P070
- id: XP-P-030
  title: 思维模型是高密度沟通压缩器
  evidence_type: explicit
  confidence: high
  statement: 成熟模型可以用短名称传达大量结构；没有模型时，必须用更细的步骤表达。
  when_to_use:
  - 专家经验产品化
  - 提示词压缩
  procedure:
  - 建立模型卡
  - 给出定义、适用条件、反例和来源
  - 在 Skill 中引用模型 ID 而非只写名称
  guardrails:
  - 不能假设模型一定知道某个同名框架的正确版本
  source_refs:
  - XP-T-002
  - XP-T-003
  legacy_source_refs:
  - XP-T-002#P014-P017
  - XP-T-003#P067-P070
- id: XP-P-031
  title: 频率×判断力×人际能力是来源中的变现公式
  evidence_type: explicit
  confidence: medium
  statement: 材料用乘法隐喻表达：高频使用 AI、专业判断力与向上协作能力共同影响结果放大。
  when_to_use:
  - 个人能力盘点
  - 制定学习重点
  procedure:
  - 分别评估使用频率、判断质量、协作能力
  - 找出最低项
  - 用项目结果验证提升
  guardrails:
  - 这是演讲中的启发式公式，不是可直接量化的经济模型
  - 应避免贬损性的人际分类
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P065-P074
  - XP-T-003#P124-P128
- id: XP-P-032
  title: 先稳住工资，再提升思维，最后验证副业
  evidence_type: explicit
  confidence: medium
  statement: 材料给出的个人路径是：先在现有工作中打磨智能体与职场效率，再提升思维与知识库，随后谨慎验证副业/创业。
  when_to_use:
  - 职业转型规划
  - 副业节奏控制
  procedure:
  - 保留现金流
  - 用真实工作训练 Skill
  - 建立学习知识库
  - 用小规模 MVP 验证副业
  guardrails:
  - 这是一般性策略，不适用于所有个人财务和职业情境
  - 重大决策需结合个人风险承受能力
  source_refs:
  - XP-T-003
  - XP-T-004#P108-P111
  legacy_source_refs:
  - XP-T-003#P118-P121
- id: XP-P-033
  title: 把 AI 作为通用能力而非单一岗位工具
  evidence_type: explicit
  confidence: medium
  statement: 材料把 AI 类比为办公软件或英语式的通用能力，并鼓励减少对既有职业标签的依赖。
  when_to_use:
  - 跨职能学习
  - 职业探索
  procedure:
  - 先学习可迁移的 AI 工作方法
  - 在现岗位产生结果
  - 再评估跨领域机会
  guardrails:
  - “行业和专业会消失”属于来源中的预测，不应写成确定事实
  - 跨专业任务仍受资质、法律和专业能力约束
  source_refs:
  - XP-T-003
  legacy_source_refs:
  - XP-T-003#P094-P101
- id: XP-P-034
  title: 用闭环加速可逆实验
  evidence_type: summarized
  confidence: medium
  statement: 让信息、方案、执行和结果形成可重复循环，可增加试验次数并缩短反馈周期。
  when_to_use:
  - 低风险 MVP
  - 内容测试
  - 流程优化
  - 优势和职业假设试炼
  procedure:
  - 设定单轮目标和停止条件
  - 限制迭代次数和成本
  - 记录每轮变化
  - 达到阈值后人工评审
  guardrails:
  - 更多迭代不保证更正确
  - 必须限制预算、权限与错误传播
  source_refs:
  - XP-T-003
  - XP-T-004#P075-P105
  legacy_source_refs:
  - XP-T-003#P035-P039
  - XP-T-003#P102-P106
- id: XP-P-035
  title: 输出后核查数据
  evidence_type: explicit
  confidence: high
  statement: 即使示例输出看起来完整，材料仍提醒需要核查其中数据。
  when_to_use:
  - 任何包含业务数字、人员信息或外部事实的输出
  procedure:
  - 逐项标出来源
  - 检查数字口径
  - 核验主体与时间
  - 未经核验的信息标记为假设
  guardrails:
  - 不得因呈现精美就降低核验标准
  source_refs:
  - XP-T-002
  legacy_source_refs:
  - XP-T-002#P077-P079
- id: XP-P-036
  title: 职业规划先内后外、逐层嵌套
  evidence_type: summarized
  confidence: high
  statement: 材料把职业规划组织为先识别、试炼和强化个人优势，再依次考察岗位、公司、行业周期、城市、学历与生涯意义。
  when_to_use:
  - 用户对当前工作不满但问题尚未定义
  - 比较多个职业选项
  procedure:
  - 先盘点用户事实、优势证据和约束
  - 再验证岗位与优势的匹配
  - 逐层加入公司、行业、城市和学历变量
  - 最后检查长期生涯方向
  guardrails:
  - 不能只凭一次测评或情绪得出离职结论
  - 不得忽略收入、家庭、健康、资质等现实约束
  source_refs:
  - XP-T-004#P003-P010
  - XP-T-004#P587-P592
- id: XP-P-037
  title: 优势要由才干、投入和结果共同验证
  evidence_type: explicit
  confidence: high
  statement: 材料用“职场优势=才干×投入”概括优势，并强调擅长不等于热爱，要有可见工作结果和持续投入作证。
  when_to_use:
  - 优势盘点
  - 岗位匹配
  - 学习与职业资源分配
  procedure:
  - 列出候选才干
  - 收集过往结果、他人反馈与主观感受
  - 记录时间和资源投入
  - 用新的小规模任务继续验证
  guardrails:
  - 乘法是启发式表达，不是可直接计算职业成功率的数学模型
  - 不将热爱、测评结果或他人评价单独当作优势事实
  source_refs:
  - XP-T-004#P012-P020
  - XP-T-004#P085-P100
  - XP-T-004#P149-P155
- id: XP-P-038
  title: 优势识别要多源交叉而非单测评定职业
  evidence_type: summarized
  confidence: high
  statement: 材料同时使用过往表现、成就感、业余行为、正向反馈、职业兴趣测评和榜样对标来生成优势假设。
  when_to_use:
  - 用户说“我不知道自己擅长什么”
  procedure:
  - 追溯做得更快或更好的任务
  - 收集有成就感的事、业余投入和他人正向反馈
  - 把测评与榜样分析作为补充线索
  - 形成待试炼的优势假设清单
  guardrails:
  - MBTI、盖洛普和霍兰德等只能作参考
  - 不把榜样的路径直接复制给条件不同的用户
  source_refs:
  - XP-T-004#P020-P036
  - XP-T-004#P038-P071
- id: XP-P-039
  title: 长板优先，限制性短板补到可用
  evidence_type: explicit
  confidence: high
  statement: 材料主张职场不按应试“总分”思路平均用力；长板应持续放大，短板只有差到阻断发展时才需先补，其余通过分工合作解决。
  when_to_use:
  - 能力发展优先级
  - 团队分工
  procedure:
  - 识别能产生结果的长板
  - 判断短板是否会阻断当前阶段
  - 必要时把限制性短板补至可用
  - 其余与他人交换长板完成协作
  guardrails:
  - 安全、道德、基本沟通和职业资质不能用“短板无所谓”规避
  source_refs:
  - XP-T-004#P118-P143
  - XP-T-004#P144-P168
- id: XP-P-040
  title: 职场能力发展按内到外分阶段
  evidence_type: explicit
  confidence: medium
  statement: 材料用同心圆表达能力发展：先建立自我管理，再在人际或思维上形成长板，最后发展领导团队和资源整合能力。
  when_to_use:
  - 能力盘点
  - 职业阶段诊断
  procedure:
  - 先检查目标、时间、情绪和自我学习
  - 再判断人际或思维哪一项可形成主长板
  - 责任和影响范围扩大后再发展团队领导力
  guardrails:
  - 课程中 1—5、5—10、10—15 年是经验性阶段，不是人人适用的年龄定律
  - “阶段不可跨越”应工程化为检查基础能力，不阻止异常路径
  source_refs:
  - XP-T-004#P125-P143
- id: XP-P-041
  title: 跳槽先降低同时变化的变量
  evidence_type: summarized
  confidence: high
  statement: 材料把留在现岗调整、同公司转岗、同岗同行业换公司等作为较连续的路径，将同时换岗位、行业和城市视为更高难度跃迁。
  when_to_use:
  - 跳槽、转岗、转行、换城市
  procedure:
  - 明确必须改变的核心变量
  - 优先保留其他可复用的变量
  - 必要时用内部转岗、登陆点或学习凭证拆分跃迁
  - 为每一步设成功、失败与回退条件
  guardrails:
  - 不把海投、降薪或试用期当作无风险实验
  - 涉及收入、签证、家庭和医保时必须先做个人风险评估
  source_refs:
  - XP-T-004#P169-P170
  - XP-T-004#P172-P216
- id: XP-P-042
  title: 优势强化是能力叠加、输出、赋能与标签的闭环
  evidence_type: explicit
  confidence: high
  statement: 材料给出四个先后相连的动作：叠加两到三项能力，以教促学输出，用分享赋能人脉网络，最后形成他人易于复述的身份标签。
  when_to_use:
  - 已有初步优势后的能力强化
  - 个人专业影响力建设
  procedure:
  - 选择能相互放大的能力组合
  - 用问题导向的教学输出倒逼学习
  - 向网络提供信息、方法或组织价值
  - 验证他人实际如何介绍自己
  guardrails:
  - “20%×20%=4%”是启发式类比，不能当作人才排名统计
  - 不得用夸大、冒用大品牌或虚构经历来打造标签
  source_refs:
  - XP-T-004#P218-P282
  - XP-T-004#P284-P296
- id: XP-P-043
  title: 专家价值可来自跨域接口能力
  evidence_type: explicit
  confidence: high
  statement: 材料把了解两个专业领域、能在其间翻译需求与约束的人称为“接口型人才”，并视为专业路径的可选强化方式。
  when_to_use:
  - 专业路径设计
  - 跨部门或产业链迁移
  procedure:
  - 明确核心专业能力
  - 找到与其高频协作但语言不同的第二领域
  - 在真实项目中练习双向翻译与交付
  guardrails:
  - 只懂两个领域的名词不等于具备接口能力
  source_refs:
  - XP-T-004#P298-P306
  - XP-T-004#P495-P503
- id: XP-P-044
  title: 管理的可见结果是让系统脱离个人仍能运行
  evidence_type: explicit
  confidence: high
  statement: 材料将管理概括为通过人做成事，把经验形成流程再赋能他人，使管理者被“拔出”后结构不散。
  when_to_use:
  - 专家转管理
  - 管理岗发展
  procedure:
  - 从事必躬亲的任务中提取可复用方法
  - 定义他人可执行的标准、反馈与升级路径
  - 用团队结果而非个人加班量验证管理能力
  guardrails:
  - 标准化不得遮蔽劳动者权益、安全或需要专业判断的例外
  source_refs:
  - XP-T-004#P307-P319
- id: XP-P-045
  title: 优势迁移优先复用已验证闭环
  evidence_type: explicit
  confidence: high
  statement: 材料提出三种优势迁移：向相邻能力域扩展，把已跑通的闭环放到多场景中复用，或以导师角色帮助年轻人加速。
  when_to_use:
  - 转岗、副业、自雇佣或第二曲线探索
  procedure:
  - 描述已稳定产生结果的最小闭环
  - 寻找输入与成功条件相似的新场景
  - 小规模试炼并比较迁移前后表现
  guardrails:
  - 相似场景不代表自动可迁移
  - 导师角色应尊重对方意愿，不以年龄当作能力判断
  source_refs:
  - XP-T-004#P354-P386
- id: XP-P-046
  title: 外部选择要用嵌套上下文判断
  evidence_type: summarized
  confidence: high
  statement: 材料强调不空谈行业、公司或岗位：行业要放在周期中，公司要放在行业中，岗位要放在公司的领导、团队和组织架构中判断。
  when_to_use:
  - 比较 offer、公司或行业
  procedure:
  - 核验行业当前需求、技术和竞争状态
  - 判断公司在行业中的实际位置
  - 核验岗位的汇报线、资源、团队与决策权
  - 再与用户优势和约束匹配
  guardrails:
  - 课程录制时的公司、行业和城市例子已过时，现在使用必须重新核验
  - S 曲线和波士顿矩阵是候选框架，不代替尽调
  source_refs:
  - XP-T-004#P388-P422
  - XP-T-004#P424-P466
  - XP-T-004#P468-P503
- id: XP-P-047
  title: 学历选择应解决已定义的当下问题
  evidence_type: explicit
  confidence: high
  statement: 材料将读书深造视为转岗、转行或换城市的可选桥梁，但要先定义当下问题，判断学业是否真能解决，而不是用学历逃避未面对的问题。
  when_to_use:
  - 考研、MBA、职业资格或返校决策
  procedure:
  - 定义要解决的岗位、行业、城市或资质门槛
  - 核验学业的录取、完成、就业与退出可行性
  - 比较学费、时间、收入损失和替代路径
  guardrails:
  - 不采用“学费越贵越好”或“提前就业绝对更好”的普遍化结论
  - 必须核验当前招生、费用、就业和资质规则
  source_refs:
  - XP-T-004#P195-P207
  - XP-T-004#P547-P567
- id: XP-P-048
  title: 职业规划与生涯规划分层对齐
  evidence_type: explicit
  confidence: high
  statement: 材料区分职业规划的“做什么”和生涯规划的“成为什么样的人”，并用简历品格与墓碑品格区分外部识别与长期意义。
  when_to_use:
  - 职业第二曲线
  - 高薪但缺乏意义感的决策
  - 职业与家庭/生活重心转换
  procedure:
  - 分别写出希望被市场识别的能力与希望长期成为的人
  - 标记当前决策服务于职业还是生涯层
  - 设计可逆试炼而非一次性豪赌
  guardrails:
  - 不鼓励用“意义”忽视现金流、抚养责任、健康或风险承受能力
  - 课程中 35—40 岁只是示例区间，不设为固定转型年龄
